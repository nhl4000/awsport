name: ci

on:
  push:
    branches:
      - main
      - ci-speed
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes the running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Build caches are saved by pushes to main only, one entry per dependency set
# (keys hash go.mod/go.sum). Pull requests and release tags restore main's
# entries; a dependency change falls back to the previous entry via restore-keys.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: ./.github/actions/setup-go
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.go.outputs.cache-path }}
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-test-${{ runner.os }}-${{ runner.arch }}-
      # vet type-checks every package, so a separate `go build` adds nothing.
      - run: go vet ./...
      - run: go test ./...
      - if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go.outputs.cache-path }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Builds every release target, so a broken cross-compile shows up before
  # tagging. The release workflow starts from this job's build cache.
  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: go
        uses: ./.github/actions/setup-go
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.go.outputs.cache-path }}
          key: goreleaser-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', '.goreleaser.yaml') }}
          restore-keys: goreleaser-${{ runner.os }}-
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true
      - run: goreleaser check
      - run: goreleaser build --snapshot --clean
      - if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.go.outputs.cache-path }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
