name: release

on:
  push:
    tags:
      - "v*"
  # Dry run on any branch: the same build as a release, packaged but not published.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    env:
      # Same flags as the GoReleaser builds, so `go test` reuses their compiled
      # packages from the build cache.
      CGO_ENABLED: "0"
      GOFLAGS: -trimpath
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: go
        uses: ./.github/actions/setup-go
      # Saved by the goreleaser-check job in ci.yml on pushes to main; tag runs
      # can restore caches from the default branch.
      - uses: actions/cache/restore@v6
        with:
          path: ${{ steps.go.outputs.cache-path }}
          key: goreleaser-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', '.goreleaser.yaml') }}
          restore-keys: goreleaser-${{ runner.os }}-
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ github.ref_type != 'tag' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
