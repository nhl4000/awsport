name: exp

on:
  push:
    branches:
      - ci-speed

permissions:
  contents: read

jobs:
  unzip:
    strategy:
      fail-fast: false
      matrix:
        tool: [7z, bsdtar, unzip, pwsh]
    runs-on: windows-latest
    name: windows unzip ${{ matrix.tool }}
    defaults:
      run:
        shell: bash
    steps:
      - run: |
          cd "$RUNNER_TEMP"
          which jq sha256sum unzip 7z || true
          curl -fsSLo go.zip https://go.dev/dl/go1.27.4.windows-amd64.zip
          mkdir out
          case "${{ matrix.tool }}" in
            7z) time 7z x -bd -y -oout go.zip >/dev/null ;;
            bsdtar) time /c/Windows/System32/tar.exe -xf go.zip -C out ;;
            unzip) time unzip -q go.zip -d out ;;
            pwsh) time pwsh -NoProfile -Command 'Expand-Archive -Path go.zip -DestinationPath out' ;;
          esac
          out/go/bin/go version
  tools:
    runs-on: macos-latest
    steps:
      - run: which jq sha256sum shasum || true
